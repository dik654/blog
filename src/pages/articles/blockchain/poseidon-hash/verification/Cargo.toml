[package]
name = "teach-poseidon-case"
version = "0.1.0"
edition = "2021"
[dependencies]
ark-ff = "=0.4.2"
ark-std = {version="=0.4.0",features=["std"]}
hex = "=0.4.3"
lazy_static = "=1.5.0"
cfg-if = "=1.0.4"
rand = {version="=0.8.8",features=["std","std_rng"]}
[features]
asm = ["ark-ff/asm"]
[[bin]]
name = "teach-poseidon-case"
path = "main.rs"
[profile.dev]
debug = 0
incremental = false
